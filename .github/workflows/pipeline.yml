name: Run equity intelligence pipeline

on:
  push:
    branches: [main]
    # Only re-run the pipeline when the actual pipeline code changes. This
    # deliberately does NOT include requirements.txt/Pipfile or tests/ or
    # ui/ -- a dependency bump or dashboard change won't auto-trigger a run
    # under this filter. If that turns out to matter, add those paths too.
    paths:
      - "src/stock_hunter/**/*.py"
      - ".github/workflows/pipeline.yml"
  workflow_dispatch: {}

concurrency:
  group: equity-pipeline
  cancel-in-progress: false

# id-token: write is what lets GitHub mint the OIDC token that GCP's
# Workload Identity Federation trusts for the db-snapshot upload step below
# -- no long-lived JSON key is stored as a secret anywhere in this repo.
permissions:
  contents: read
  id-token: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # Force line-buffered/unbuffered stdout so print()-based logging streams
      # live in the Actions log instead of sitting in a buffer that only
      # flushes on a clean exit (and is lost entirely on an abnormal one).
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize database schema
        env:
          PYTHONPATH: src
        run: python -u -m stock_hunter.schema

      - name: Run full pipeline (one-shot)
        env:
          PYTHONPATH: src
          # Only secrets that are actually set in this repo are declared here.
          # Do NOT add a line for a secret you haven't created yet -- GitHub
          # Actions substitutes an empty string for a missing secret rather
          # than omitting the variable, and an empty-but-present env var
          # short-circuits ai_narrative.py's os.getenv(...) fallback chains
          # before they ever reach a working default (this broke the nim
          # model lookup via an unset NVIDIA_NIM_MODEL secret).
          NARRATIVE_PROVIDER: ${{ secrets.NARRATIVE_PROVIDER }}
          NARRATIVE_MODEL: ${{ secrets.NARRATIVE_MODEL }}
          NARRATIVE_FALLBACK_PROVIDER: ${{ secrets.NARRATIVE_FALLBACK_PROVIDER }}
          NARRATIVE_FALLBACK_MODEL: ${{ secrets.NARRATIVE_FALLBACK_MODEL }}
          NARRATIVE_TEMPERATURE: ${{ secrets.NARRATIVE_TEMPERATURE }}
          NARRATIVE_MAX_TOKENS: ${{ secrets.NARRATIVE_MAX_TOKENS }}
          NARRATIVE_MAX_RPS: ${{ secrets.NARRATIVE_MAX_RPS }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COHERE_API_BASE: ${{ secrets.COHERE_API_BASE }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_NIM_API_BASE: ${{ secrets.NVIDIA_NIM_API_BASE }}
          # Dedicated model used only for concentration-risk scoring
          # (ai_narrative.py score_concentration_risk) -- falls back to the
          # primary NARRATIVE_PROVIDER only if GEMINI_API_KEY is unset.
          # GEMINI_MODEL/GEMINI_API_BASE use `os.getenv(name) or default` in
          # code (not the getenv(name, default) form), so it's safe for these
          # lines to exist even before the secret is created. GEMINI_MAX_TOKENS
          # needs to be generous (default 4000): thinking-capable models like
          # gemma-4-31b-it spend a large chunk of this budget on an internal
          # reasoning trace before the real JSON answer.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_API_BASE: ${{ secrets.GEMINI_API_BASE }}
          GEMINI_MAX_RPS: ${{ secrets.GEMINI_MAX_RPS }}
          GEMINI_MAX_TOKENS: ${{ secrets.GEMINI_MAX_TOKENS }}
        run: |
          set -euo pipefail
          python -u -m stock_hunter.service 2>&1 | tee pipeline_run.log

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pipeline-run-log-${{ github.run_id }}
          path: pipeline_run.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload resulting database
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: drawdown-analyzer-db-${{ github.run_id }}
          path: drawdown_analyzer.db
          retention-days: 14

      - name: Upload SEC companyfacts cache
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sec-companyfacts-cache-${{ github.run_id }}
          path: cache/sec_companyfacts
          retention-days: 14
          if-no-files-found: ignore

      # No `if: always()` here, deliberately -- unlike the artifact uploads
      # above (which exist to help debug a failed run), this snapshot is what
      # candidate_finder/position_monitor actually read to make screening
      # decisions. Only publish it on a successful run, so a failed/partial
      # run never overwrites a known-good snapshot with a bad one.
      - name: Authenticate to GCP (for db-snapshot upload)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/444713174784/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "pipeline-uploader-sa@stock-hunter-trading.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload db snapshot to GCS (if the bucket exists)
        run: |
          set -uo pipefail
          BUCKET="gs://stock-hunter-trading-db-snapshot"
          if gcloud storage buckets describe "$BUCKET" >/dev/null 2>&1; then
            gcloud storage cp drawdown_analyzer.db "$BUCKET/drawdown_analyzer.db"
            echo "Uploaded drawdown_analyzer.db to $BUCKET"
          else
            echo "$BUCKET does not exist yet (infra not deployed?) -- skipping db-snapshot upload"
          fi
