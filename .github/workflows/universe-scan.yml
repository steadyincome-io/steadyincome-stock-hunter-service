name: Weekly $50B universe scan

on:
  schedule:
    # Sunday ~6:19am UTC -- deliberately off the hour/half-hour so this
    # doesn't land at the same instant as every other scheduled job on
    # GitHub's infrastructure.
    - cron: "19 6 * * 0"
  workflow_dispatch: {}

concurrency:
  group: universe-scan
  cancel-in-progress: false

# contents: write is needed to commit the resulting CSV back to the repo.
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # ~13,000 symbols at a deliberately conservative, sequential pace is
    # roughly an hour -- see universe_scanner.py's module docstring for why
    # this isn't sped up with concurrency (Yahoo throttling/blocking risk).
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run universe scan
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -u -m stock_hunter.universe_scanner 2>&1 | tee universe_scan.log

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: universe-scan-log-${{ github.run_id }}
          path: universe_scan.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit and push the resulting CSV
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/universe_50b.csv
          if git diff --cached --quiet; then
            echo "No changes to universe_50b.csv -- nothing to commit"
          else
            git commit -m "Update \$50B universe scan"
            git push
          fi
